apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: revplay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: revplaystreaming-api-gateway:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: CONFIG_SERVER_URL
              value: "http://config-server:8888/"
            - name: EUREKA_URI
              value: "http://discovery-server:8761/eureka/"
            - name: EUREKA_HOSTNAME
              value: "api-gateway"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: revplay
spec:
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: NodePort
